<input type="file" id="fileInput" class="hidden" accept=".pdf"/>

<script>
    const { PDFDocument, degrees } = PDFLib;
    const workspace = document.getElementById('workspace');
    const fileInput = document.getElementById('fileInput');
    const downloadBtn = document.getElementById('downloadBtn');

    let pageList = []; 

    new Sortable(workspace, {
        animation: 200,
        ghostClass: 'sortable-ghost',
        draggable: '.page-card',
        onEnd: () => {
            const currentIds = Array.from(workspace.querySelectorAll('.page-card')).map(el => el.id);
            pageList = currentIds.map(id => pageList.find(p => p.id === id));
        }
    });

    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('empty-state').classList.add('hidden');

        const buffer = await file.arrayBuffer();
        const pdfData = new Uint8Array(buffer);
        const pdf = await pdfjsLib.getDocument({ data: pdfData.slice(0) }).promise;

        for (let i = 1; i <= pdf.numPages; i++) {
            const id = "pg-" + Math.random().toString(36).substr(2, 9);
            const pageObj = { id, buffer: pdfData, pageNum: i, rotation: 0, selected: true };
            pageList.push(pageObj);
            await createThumb(pageObj, pdf);
        }
        updateUI();
        fileInput.value = '';
    };

    async function createThumb(pageObj, pdf) {
        const page = await pdf.getPage(pageObj.pageNum);
        const viewport = page.getViewport({ scale: 0.35 });
        const canvas = document.createElement('canvas');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        const card = document.createElement('div');
        card.id = pageObj.id;
        card.className = "page-card selected bg-white rounded-2xl p-2 shadow-sm cursor-pointer hover:shadow-lg";
        card.onclick = (e) => { if(!e.target.closest('button')) toggleSelection(pageObj.id); };
        
        card.innerHTML = `
            <div class="relative aspect-[3/4] rounded-xl overflow-hidden bg-orange-50 flex items-center justify-center">
                <img id="img-${pageObj.id}" src="${canvas.toDataURL()}" class="rotate-view max-w-full max-h-full pointer-events-none">
                <div class="absolute top-2 right-2 bg-orange-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[8px] shadow-lg border border-white check-icon">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div class="absolute inset-0 bg-orange-900/40 opacity-0 hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                    <button onclick="rotatePg('${pageObj.id}')" class="w-8 h-8 bg-white text-orange-600 rounded-lg shadow-lg hover:bg-orange-500 hover:text-white transition"><i class="fa-solid fa-rotate-right"></i></button>
                    <button onclick="deletePg('${pageObj.id}')" class="w-8 h-8 bg-white text-rose-500 rounded-lg shadow-lg hover:bg-rose-500 hover:text-white transition"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <p class="text-[9px] font-black text-center mt-2 text-slate-400">PAGE ${pageObj.pageNum}</p>
        `;
        workspace.appendChild(card);
    }

    window.toggleSelection = (id) => {
        const p = pageList.find(x => x.id === id);
        p.selected = !p.selected;
        const card = document.getElementById(id);
        card.classList.toggle('selected', p.selected);
        card.querySelector('.check-icon').style.display = p.selected ? 'flex' : 'none';
        updateUI();
    };

    window.rotatePg = (id) => {
        const p = pageList.find(x => x.id === id);
        p.rotation = (p.rotation + 90) % 360;
        document.getElementById(`img-${id}`).style.transform = `rotate(${p.rotation}deg)`;
    };

    window.deletePg = (id) => {
        pageList = pageList.filter(x => x.id !== id);
        document.getElementById(id).remove();
        updateUI();
    };

    window.bulkAction = (type) => {
        pageList.forEach(p => {
            p.selected = (type === 'select');
            const card = document.getElementById(p.id);
            card.classList.toggle('selected', p.selected);
            card.querySelector('.check-icon').style.display = p.selected ? 'flex' : 'none';
        });
        updateUI();
    };

    function updateUI() {
        const selCount = pageList.filter(p => p.selected).length;
        downloadBtn.disabled = selCount === 0;
        downloadBtn.innerText = `EXPORT ${selCount} PAGES`;
    }

    // --- AUTO-SPLIT ZIP FEATURE ---
    window.autoSplitDownload = async () => {
        const interval = parseInt(document.getElementById('splitInterval').value);
        if(!pageList.length || interval < 1) return;
        
        const zip = new JSZip();
        const sourceMap = new Map();

        for (let i = 0; i < pageList.length; i += interval) {
            const chunk = pageList.slice(i, i + interval);
            const newPdf = await PDFDocument.create();
            
            for (const p of chunk) {
                if (!sourceMap.has(p.buffer)) sourceMap.set(p.buffer, await PDFDocument.load(p.buffer.slice(0)));
                const [copied] = await newPdf.copyPages(sourceMap.get(p.buffer), [p.pageNum - 1]);
                if (p.rotation !== 0) copied.setRotation(degrees(copied.getRotation().angle + p.rotation));
                newPdf.addPage(copied);
            }
            
            const bytes = await newPdf.save();
            zip.file(`Split_Part_${(i/interval)+1}.pdf`, bytes);
        }

        const blob = await zip.generateAsync({type: "blob"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Auto_Split_PDF.zip`;
        a.click();
    };

    downloadBtn.onclick = async () => {
        const selected = pageList.filter(p => p.selected);
        downloadBtn.innerText = "PROCESSING...";
        downloadBtn.disabled = true;

        try {
            const mergedPdf = await PDFDocument.create();
            const sourceMap = new Map();

            for (const p of selected) {
                if (!sourceMap.has(p.buffer)) sourceMap.set(p.buffer, await PDFDocument.load(p.buffer.slice(0)));
                const [copied] = await mergedPdf.copyPages(sourceMap.get(p.buffer), [p.pageNum - 1]);
                if (p.rotation !== 0) copied.setRotation(degrees(copied.getRotation().angle + p.rotation));
                mergedPdf.addPage(copied);
            }

            const bytes = await mergedPdf.save();
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Orange_Export_${Date.now()}.pdf`;
            a.click();
        } catch (err) {
            alert(err.message);
        } finally {
            updateUI();
        }
    };
</script>
